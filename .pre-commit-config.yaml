repos:
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format
        entry: /opt/homebrew/bin/swift-format format --in-place
        language: system
        types: [swift]
        # Helper fourni tel quel par fastlane snapshot — ne pas le reformater
        # (même exclusion que dans ios/.swiftlint.yml).
        exclude: '^ios/HolyDayUITests/SnapshotHelper\.swift$'

      - id: swiftlint
        name: SwiftLint
        # Le hook tourne depuis la racine du dépôt, mais la config vit dans ios/ : sans
        # --config explicite SwiftLint ne la trouve pas et lint avec ses règles par défaut.
        entry: /opt/homebrew/bin/swiftlint lint --config ios/.swiftlint.yml
        language: system
        types: [swift]

      # Le Fastfile et les notes de test ne sont ni compilés ni testés : une faute purement
      # textuelle n'y était découverte qu'après huit minutes de build sur un runner macOS.
      # Reproduit les deux pannes réellement vécues (caractère refusé par App Store Connect,
      # collision lane/helper) en moins d'une seconde.
      - id: check-fastlane
        name: Fastlane (syntaxe, collisions, notes ASCII)
        entry: scripts/check-fastlane.sh
        language: system
        pass_filenames: false
        files: '^ios/fastlane/'
