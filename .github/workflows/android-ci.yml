name: Android CI

# Monorepo : symétrique de ios-ci.yml — un commit iOS-only ne relance pas la CI Android.
# `shared/` est inclus car verses.json y est la source de vérité du corpus embarqué.
on:
  push:
    branches:
      - main
      - "feature/*"
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches:
      - main
      - "feature/*"
    # Dupliqué volontairement : le parseur de workflows GitHub ne gère pas les ancres YAML.
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Un seul job, contrairement à ios-ci.yml : lint, tests et assemblage partagent le même
  # graphe de tâches Gradle (kspDebugKotlin, compileDebugKotlin…). Les séparer en jobs
  # recompilerait tout deux fois pour aucun gain de signal — les étapes ci-dessous
  # suffisent à identifier ce qui casse.
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle-wrapper.jar est un binaire versionné : on vérifie son checksum avant
      # de l'exécuter.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # JDK 17 : imposé par compileOptions/jvmTarget dans android/app/build.gradle.kts.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew assembleDebug

      # Valide la config R8 : isMinifyEnabled + isShrinkResources + proguard-rules.pro.
      # L'APK produit n'est pas signé (aucun signingConfig release), ce qui suffit ici.
      - name: Assemble release (R8)
        run: ./gradlew assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
