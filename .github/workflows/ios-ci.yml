name: iOS CI

# Monorepo : sans filtre, un commit Android-only relancerait toute la CI iOS.
# `shared/` est inclus car verses.json y est la source de vérité du corpus embarqué.
on:
  push:
    branches:
      - main
      - "feature/*"
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches:
      - main
      - "feature/*"
    # Dupliqué volontairement : le parseur de workflows GitHub ne gère pas les ancres YAML.
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (SwiftLint + swift-format)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftLint
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-lint
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install linters
        run: brew install swiftlint swift-format

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      # HolyDayUITests/SnapshotHelper.swift est fourni tel quel par fastlane : listé par
      # fichier plutôt qu'en --recursive, car swift-format n'a pas d'option d'exclusion.
      - name: Run swift-format
        run: |
          swift-format lint --strict --recursive \
            HolyDay/ HolyDayShared/ HolyDayTests/ HolyDayWidget/ \
            HolyDayUITests/HolyDayUITests.swift

  periphery:
    name: Periphery (dead code)
    runs-on: macos-latest
    needs: lint
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ios/DerivedData
          key: ${{ runner.os }}-periphery-deriveddata-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-periphery-deriveddata-

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Resolve Swift Packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project HolyDay.xcodeproj \
            -scheme "HolyDay Dev"

      - name: Build for indexing
        run: |
          xcodebuild build \
            -project HolyDay.xcodeproj \
            -scheme "HolyDay Dev" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Scan for unused code
        run: |
          periphery scan \
            --skip-build \
            --index-store-path DerivedData/Index.noindex/DataStore \
            --strict \
            --disable-update-check \
            --relative-results \
            --format github-actions

  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    needs: lint
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project HolyDay.xcodeproj \
            -scheme "HolyDay Dev"

      # Le nom du simulateur par défaut change à chaque mise à jour de l'image runner
      # (iPhone 16 → 17 …). On résout dynamiquement un iPhone disponible plutôt que de
      # pinner un nom qui finit par disparaître.
      - name: Select simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; devs=[d for r in json.load(sys.stdin)['devices'].values() for d in r if 'iPhone' in d['name']]; assert devs, 'no iPhone simulator available'; print(devs[-1]['udid'])")
          echo "Using simulator $UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build & Test
        run: |
          xcodebuild \
            clean test \
            -project HolyDay.xcodeproj \
            -scheme "HolyDay Dev"\
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --report junit --output test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ios/TestResults.xcresult
            ios/test-results.xml
          retention-days: 7
